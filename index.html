<h2>Document Approval Portal</h2>

<form action="/upload" method="post" enctype="multipart/form-data">
  <input name="subject" placeholder="Subject"><br><br>
  <input name="a1" placeholder="Approver 1 Email"><br>
  <input name="a2" placeholder="Approver 2 Email"><br>
  <input name="a3" placeholder="Approver 3 Email"><br><br>
  <input type="file" name="file"><br><br>
  <button type="submit">Submit</button>
</form>
